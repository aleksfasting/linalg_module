name: Enforce PR approvals

on:
  pull_request:
    branches:
      - main

jobs:
  require-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR has approvals
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            // Only count the latest review per user, and only if it's APPROVED
            const latestReviews = {};
            for (const review of reviews) {
              const userId = review.user.id;
              if (
                !latestReviews[userId] ||
                new Date(review.submitted_at) > new Date(latestReviews[userId].submitted_at)
              ) {
                latestReviews[userId] = review;
              }
            }
            const approvals = Object.values(latestReviews).filter(r => r.state === "APPROVED");
            if (approvals.length < 1) {
              core.setFailed("[ERROR]: This PR needs at least 1 approval before merging.");
            } else {
              console.log("[Passed]: At least 1 approval found.");
            }
